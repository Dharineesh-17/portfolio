<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Welcome">
  <defs>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#FF5F6D"/>
      <stop offset="0.2" stop-color="#FFC371"/>
      <stop offset="0.4" stop-color="#7EE081"/>
      <stop offset="0.6" stop-color="#00E5FF"/>
      <stop offset="0.8" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF5F6D"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ADB5" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#00ADB5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ADB5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ambient halo, breathing -->
  <ellipse cx="450" cy="115" rx="240" ry="90" fill="url(#halo)">
    <animate attributeName="rx" values="220;285;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="78;108;78" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Welcome: pop-in entrance, then float + pulse forever -->
  <g transform="translate(450 118)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.35;1.09;1" keyTimes="0;0.62;1" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.35 1.25;0.35 0 0.6 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 7;0 0" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;1.045;1" dur="2.6s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.4 1;0.3 0 0.4 1"/>
          <text x="0" y="30" text-anchor="middle" font-family="'Segoe Script','Apple Chancery','Brush Script MT','Comic Sans MS',cursive" font-style="italic" font-weight="700" font-size="98" letter-spacing="2" fill="url(#rainbow)" filter="url(#glow)">Welcome</text>
        </g>
      </g>
    </g>
  </g>

  <!-- twinkling sparkles -->
  <g>
    <g transform="translate(148 62)"><path d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z" fill="#FFC371">
      <animateTransform attributeName="transform" type="scale" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="2.7s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(756 76)"><path d="M0 -13 Q2.2 -2.2 13 0 Q2.2 2.2 0 13 Q-2.2 2.2 -13 0 Q-2.2 -2.2 0 -13 Z" fill="#00E5FF">
      <animateTransform attributeName="transform" type="scale" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(116 170)"><path d="M0 -9 Q1.5 -1.5 9 0 Q1.5 1.5 0 9 Q-1.5 1.5 -9 0 Q-1.5 -1.5 0 -9 Z" fill="#FF5F6D">
      <animateTransform attributeName="transform" type="scale" values="1;0.35;1" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(788 174)"><path d="M0 -10 Q1.8 -1.8 10 0 Q1.8 1.8 0 10 Q-1.8 1.8 -10 0 Q-1.8 -1.8 0 -10 Z" fill="#7B61FF">
      <animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(268 40)"><path d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#7EE081">
      <animateTransform attributeName="transform" type="scale" values="1;0.4;1" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" begin="1s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(638 44)"><path d="M0 -8 Q1.4 -1.4 8 0 Q1.4 1.4 0 8 Q-1.4 1.4 -8 0 Q-1.4 -1.4 0 -8 Z" fill="#FFC371">
      <animateTransform attributeName="transform" type="scale" values="0.45;1;0.45" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
    </path></g>
  </g>

  <!-- tiny distant stars -->
  <g fill="#FFFFFF">
    <circle cx="95" cy="112" r="2.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="812" cy="118" r="2"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="28" r="2"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="206" r="2.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="24" r="1.8"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="302" cy="204" r="2"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="118" r="1.7"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="716" cy="128" r="1.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
